<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <!-- Storage Banner -->
    <div id="storage-banner" class="banner banner--error" hidden role="alert"></div>

    <main>
      <h1>Expense &amp; Budget Visualizer</h1>

      <!-- Task 7.2: Theme toggle button -->
      <button id="theme-toggle" type="button">🌙 Dark Mode</button>

      <!-- Balance Display (Task 7.5: label updated to "Net Balance:") -->
      <div id="balance-display">
        Net Balance: <span id="balance-amount">0.00</span>
      </div>

      <!-- Input Form -->
      <section id="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              id="item-name"
              type="text"
              maxlength="100"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
            <span id="err-name" class="error-msg" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="item-amount">Amount ($)</label>
            <input
              id="item-amount"
              type="number"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="0.00"
            />
            <span id="err-amount" class="error-msg" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="item-category">Category</label>
            <select id="item-category">
              <option value="">-- Select category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span id="err-category" class="error-msg" aria-live="polite"></span>
          </div>

          <!-- Task 7.1: Income / Expense type selector -->
          <div class="form-group">
            <label for="item-type">Type</label>
            <select id="item-type">
              <option value="">-- Select type --</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <span id="err-type" class="error-msg" aria-live="polite"></span>
          </div>

          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <!-- Task 7.3: Custom Category section -->
      <section id="categories-section" aria-labelledby="categories-heading">
        <h2 id="categories-heading">Custom Categories</h2>
        <div class="form-group">
          <label for="new-category-name">Category Name</label>
          <input id="new-category-name" type="text" maxlength="50" placeholder="e.g. Healthcare" autocomplete="off" />
          <span id="err-category-name" class="error-msg" aria-live="polite"></span>
        </div>
        <button id="add-category-btn" type="button">Add Category</button>
        <ul id="custom-category-list" aria-label="Custom categories"></ul>
      </section>

      <!-- Transaction List -->
      <section id="list-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transaction History</h2>

        <!-- Task 7.4: Sort controls -->
        <div id="sort-controls">
          <label for="sort-field">Sort by:</label>
          <select id="sort-field">
            <option value="none">None</option>
            <option value="amount">Amount</option>
            <option value="category">Category</option>
          </select>
          <label for="sort-direction">Direction:</label>
          <select id="sort-direction">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>

        <p id="empty-msg">No transactions recorded yet.</p>
        <ul id="transaction-list" aria-label="Transaction history"></ul>
      </section>

      <!-- Spending Chart -->
      <section id="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <div id="chart-container">
          <canvas id="spending-chart"></canvas>
          <p id="chart-empty-msg" hidden>No spending data available.</p>
        </div>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
